name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer le repository
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check scripts/ tests/

      - name: Valider la structure du JSON de collections
        run: python3 scripts/valider_collections.py

      - name: Vérifier la cohérence de la configuration (groupes, slugs, filtres)
        run: python3 scripts/lint_config.py

      - name: Vérification des types (mypy)
        run: mypy scripts/ --ignore-missing-imports

      - name: Tests (pytest)
        run: pytest tests/ -v

      - name: Générer et commiter le badge de couverture
        # Seulement sur push vers main : jamais sur une PR (pas de droit
        # d'écriture garanti, et on ne veut pas polluer les branches de
        # travail avec des commits automatiques).
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          pip install coverage-badge==1.1.2
          coverage-badge -o coverage.svg -f
          git add coverage.svg
          if git diff --cached --quiet; then
            echo "Couverture inchangée, rien à commiter."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: mettre à jour le badge de couverture"
          git push
