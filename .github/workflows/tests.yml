name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le repository
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check scripts/ tests/

      - name: Valider la structure du JSON de collections
        run: python3 scripts/valider_collections.py

      - name: Vérification des types (mypy)
        run: mypy scripts/ --ignore-missing-imports
        continue-on-error: true # informatif pour l'instant, pas bloquant

      - name: Tests (pytest)
        run: pytest tests/ -v
