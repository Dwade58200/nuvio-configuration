name: Générer les Backdrops

on:
  schedule:
    - cron: "0 4 1 * *"  # 1er du mois à 4h00 UTC
  workflow_dispatch:      # Lancement manuel

permissions:
  contents: write

jobs:
  generer-backdrops:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow requests

      - name: Générer les backdrops
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          CLE_API_TMDB: ${{ secrets.CLE_API_TMDB }}
          CLE_API_FANART: ${{ secrets.CLE_API_FANART }}
        run: |
          python3 -B scripts/generer_backdrops.py \
            --cle-api "$CLE_API_TMDB" \
            --cle-fanart "$CLE_API_FANART" \
            --collections Templates/Nuvio-Collections-Dwade58200.json \
            --sortie collections \
            --profil compresse \
            --parallelisme 3

      - name: Nettoyer les caches Python
        run: |
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +

      - name: Commiter et pousser les changements
        id: publication
        run: |
          if git diff --quiet; then
            echo "Aucun changement à commiter."
            echo "modifie=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collections/
          git commit -m "chore: actualiser les backdrops des collections"
          git push
          echo "modifie=true" >> "$GITHUB_OUTPUT"

      - name: Vider le cache CDN
        if: steps.publication.outputs.modifie == 'true'
        run: python3 -B scripts/purger_cache.py
