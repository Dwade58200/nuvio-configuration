name: Générer les Backdrops

on:
  schedule:
    - cron: "0 4 1 * *"  # 1er du mois à 4h00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Mode simulation (aucun appel TMDB, aucun commit)"
        type: boolean
        default: false
      groupe:
        description: "Ne traiter qu'un seul groupe (ex: Genres) — laisser vide pour tous"
        required: false
        default: ""
      limite:
        description: "Limiter le nombre de dossiers traités (tests rapides) — laisser vide pour tous"
        required: false
        default: ""
      desactiver_mosaique:
        description: "Débug : forcer l'ancien mode 1 seul backdrop par dossier"
        type: boolean
        default: false
      mettre_a_jour_urls:
        description: "Mettre à jour heroBackdropUrl dans le JSON (à activer seulement quand de nouveaux dossiers viennent d'être résolus, pas à chaque run)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generer-backdrops:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow requests

      - name: Générer les backdrops
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_ACCESS_TOKEN: ${{ secrets.TRAKT_ACCESS_TOKEN }}
          TRAKT_REFRESH_TOKEN: ${{ secrets.TRAKT_REFRESH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          GROUPE: ${{ inputs.groupe }}
          LIMITE: ${{ inputs.limite }}
          DESACTIVER_MOSAIQUE: ${{ inputs.desactiver_mosaique }}
        run: |
          ARGS=(--collections Templates/Nuvio-Collections-Dwade58200.json --sortie collections --profil compresse --parallelisme 3)
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ -n "$GROUPE" ]; then ARGS+=(--groupe "$GROUPE"); fi
          if [ -n "$LIMITE" ]; then ARGS+=(--limite "$LIMITE"); fi
          if [ "$DESACTIVER_MOSAIQUE" != "true" ]; then ARGS+=(--mosaique); fi
          if [ -f "Templates/aiometadata-setup.json" ]; then ARGS+=(--aiometadata "Templates/aiometadata-setup.json"); fi
          ARGS+=(--fichier-tokens-trakt /tmp/trakt-tokens.json)
          python3 -B scripts/generer_backdrops.py "${ARGS[@]}"

      - name: Sauvegarder les tokens Trakt renouvelés (si un PAT est configuré)
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETS }}
        run: |
          if [ ! -f /tmp/trakt-tokens.json ]; then
            echo "Aucun token Trakt renouvelé cette fois, rien à sauvegarder."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "⚠️  Le refresh_token Trakt a changé mais GH_PAT_SECRETS n'est pas configuré :"
            echo "    les secrets ne peuvent pas être mis à jour automatiquement."
            echo "    Il faudra relancer scripts/trakt_auth.py en local si l'authentification finit par expirer."
            exit 0
          fi
          ACCESS=$(python3 -c "import json; print(json.load(open('/tmp/trakt-tokens.json'))['access_token'])")
          REFRESH=$(python3 -c "import json; print(json.load(open('/tmp/trakt-tokens.json'))['refresh_token'])")
          echo "$ACCESS" | gh secret set TRAKT_ACCESS_TOKEN --repo "${{ github.repository }}"
          echo "$REFRESH" | gh secret set TRAKT_REFRESH_TOKEN --repo "${{ github.repository }}"
          echo "✅ Secrets TRAKT_ACCESS_TOKEN / TRAKT_REFRESH_TOKEN mis à jour."

      - name: Mettre à jour heroBackdropUrl vers les images générées
        if: ${{ inputs.dry_run != true && inputs.mettre_a_jour_urls == true }}
        run: |
          python3 -B scripts/mettre_a_jour_urls.py \
            --collections Templates/Nuvio-Collections-Dwade58200.json \
            --sortie collections \
            --depot "${{ github.repository }}" \
            --branche "${{ github.ref_name }}"

      - name: Nettoyer les caches Python
        run: |
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +

      - name: Commiter et pousser les changements
        id: publication
        if: ${{ inputs.dry_run != true }}
        run: |
          git add collections/ Templates/
          if git diff --cached --quiet; then
            echo "Aucun changement à commiter."
            echo "modifie=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: actualiser les backdrops et les heroBackdropUrl"
          git push
          echo "modifie=true" >> "$GITHUB_OUTPUT"

      - name: Vider le cache CDN jsDelivr
        if: steps.publication.outputs.modifie == 'true'
        run: python3 -B scripts/purger_cache.py --depot "${{ github.repository }}" --branche "${{ github.ref_name }}"
