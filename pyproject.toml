[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501", # longueur de ligne -- déjà couverte par line-length, mais certaines
            # chaînes (messages utilisateur, URLs) dépassent volontairement
    "E402", # import en milieu de fichier -- requis pour config_collections/mosaique après logging
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=scripts --cov-report=term-missing --cov-report=html --cov-fail-under=75"
